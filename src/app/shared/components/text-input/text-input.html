<div class="input-block">
  <label class="input-label">{{ label }}</label>
  <div class="input-control" [class.has-password-toggle]="type === 'password'">
    <input
      #inputElement
      [type]="currentInputType"
      [placeholder]="placeholder"
      [attr.autocomplete]="autocomplete || null"
      class="modal-input"
      [class.invalid]="showValidation && !isValid"
      [(ngModel)]="inputValue"
      (ngModelChange)="onInputChange($event)"
    />
    <button
      *ngIf="type === 'password'"
      type="button"
      class="password-toggle"
      (pointerdown)="onPasswordTogglePointerDown($event)"
      (click)="onPasswordToggleClick($event)"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="showPassword"
    >
      <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5C6.5 5 2.1 8.4 1 12c1.1 3.6 5.5 7 11 7s9.9-3.4 11-7c-1.1-3.6-5.5-7-11-7zm0 11.2A4.2 4.2 0 1 1 12 7.8a4.2 4.2 0 0 1 0 8.4zm0-6.4A2.2 2.2 0 1 0 12 14.2a2.2 2.2 0 0 0 0-4.4z"/>
      </svg>
      <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.7 1.3 1.3 2.7l3 3A11.8 11.8 0 0 0 1 12c1.1 3.6 5.5 7 11 7 2.2 0 4.1-.5 5.8-1.4l3 3 1.4-1.4L2.7 1.3zM12 17c-4.3 0-7.8-2.5-9-5 0-1.4 1.6-3.3 4-4.5l1.7 1.7a4.2 4.2 0 0 0 5.1 5.1l1.7 1.7c-1 .6-2.2 1-3.5 1zm0-10c4.3 0 7.8 2.5 9 5-.4 1.1-1.5 2.4-3.1 3.4l-1.5-1.5A4.2 4.2 0 0 0 10 7.6L8.5 6.1c1.1-.7 2.3-1.1 3.5-1.1z"/>
      </svg>
    </button>
  </div>
  <small class="input-error" *ngIf="showValidation && !isValid">{{ validationMessage }}</small>
</div>
